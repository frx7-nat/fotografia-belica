<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PL62H9PF13"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-PL62H9PF13');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contato – fotografia bélica</title>
  <meta name="description" content="Entre em contato com fotografia bélica.">
  <link rel="canonical" href="https://fotografiabelica.com.br/contato.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafaf8;
      --text: #2c2c2c;
      --card-bg: #fff;
      --border: #eae6e0;
      --heading: #1a1a1a;
      --muted: #8c8c8c;
      --link: #555;
      --link-hover: #1a1a1a;
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
      --label: #555;
    }
    body.dark {
      --bg: #1c1c1a;
      --text: #d6d2ca;
      --card-bg: #262522;
      --border: #3a3935;
      --heading: #e6e2d8;
      --muted: #7a7870;
      --link: #aaa69c;
      --link-hover: #e6e2d8;
      --shadow: 0 1px 3px rgba(0,0,0,0.15);
      --label: #b0aca2;
    }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 5vw;
      min-height: 100vh;
    }
    .form-wrapper {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      padding: 3rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }
    h1 {
      font-size: 2rem;
      font-weight: 400;
      color: var(--heading);
      margin-bottom: 0.5rem;
      text-align: center;
      line-height: 1.3;
    }
    .tema-btn {
      background: none; border: 1px solid var(--border); padding: 0.3rem 0.9rem;
      font-size: 0.8rem; font-family: inherit; cursor: pointer; color: var(--muted);
      letter-spacing: 0.5px; transition: 0.2s; border-radius: 3px; margin-bottom: 1.5rem;
    }
    .tema-btn:hover { border-color: var(--heading); color: var(--heading); }

    .email-wrapper {
      text-align: center;
      padding: 1rem 0 0.5rem;
    }
    .btn-copiar {
      background: none;
      border: 1px solid var(--border);
      padding: 0.6rem 2rem;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      color: var(--link);
      transition: 0.2s;
      margin-top: 0.8rem;
    }
    .btn-copiar:hover {
      border-color: var(--link-hover);
      color: var(--link-hover);
    }
    .copiado {
      display: none;
      color: var(--muted);
      font-size: 0.85rem;
      margin-left: 0.8rem;
    }
    .copiado.visivel {
      display: inline;
    }
    footer { margin-top: 2.5rem; }
    a.back {
      display: inline-block;
      background: none;
      border: 1px solid var(--border);
      padding: 0.6rem 1.8rem;
      font-size: 0.95rem;
      font-family: inherit;
      text-decoration: none;
      color: var(--link);
      transition: 0.2s;
    }
    a.back:hover { border-color: var(--link-hover); color: var(--link-hover); }
    @media (max-width: 600px) {
      body { padding: 1.5rem 3vw; }
      .form-wrapper {
        padding: 2.2rem 1rem;
        border-radius: 0;
        border-left: none;
        border-right: none;
        box-shadow: none;
      }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <button id="temaToggle" class="tema-btn" aria-label="Alternar modo claro/escuro">modo escuro</button>
    <h1>contato</h1>
    <div class="email-wrapper">
      <p style="text-align:center;color:var(--muted);margin-bottom:2rem;font-size:0.95rem;">
        <a href="mailto:natalier.profissional@gmail.com" style="color:var(--heading);text-decoration:none;border-bottom:1px dotted var(--muted);font-size:1.1rem;">natalier.profissional@gmail.com</a>
      </p>
      <button id="btnCopiar" class="btn-copiar">copiar email</button>
      <span class="copiado" id="msgCopiado">copiado!</span>
    </div>
  </div>

  <footer>
    <a href="index.html" class="back">← voltar ao blog</a>
  </footer>

  <script>
    (function() {
      var b = document.body, t = document.getElementById('temaToggle'), d = localStorage.getItem('tema') === 'escuro';
      if (d) b.classList.add('dark');
      if (t) {
        t.textContent = d ? 'claro' : 'escuro';
        t.addEventListener('click', function() {
          b.classList.toggle('dark');
          var e = b.classList.contains('dark');
          localStorage.setItem('tema', e ? 'escuro' : 'claro');
          t.textContent = e ? 'modo claro' : 'modo escuro';
        });
      }
    })();

    document.getElementById('btnCopiar').addEventListener('click', function() {
      var email = 'natalier.profissional@gmail.com';
      navigator.clipboard.writeText(email).then(function() {
        var msg = document.getElementById('msgCopiado');
        msg.classList.add('visivel');
        setTimeout(function() { msg.classList.remove('visivel'); }, 2000);
      });
    });
  </script>
</body>
</html>
