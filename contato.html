<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contato – fotografia bélica</title>
  <meta name="description" content="Entre em contato com fotografia bélica.">
  <link rel="canonical" href="https://fotografiabelica.com.br/contato.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafaf8;
      --text: #2c2c2c;
      --card-bg: #fff;
      --border: #eae6e0;
      --heading: #1a1a1a;
      --muted: #8c8c8c;
      --link: #555;
      --link-hover: #1a1a1a;
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
      --input-bg: #fcfcfb;
      --input-border: #d6d2ca;
      --label: #555;
    }
    body.dark {
      --bg: #1c1c1a;
      --text: #d6d2ca;
      --card-bg: #262522;
      --border: #3a3935;
      --heading: #e6e2d8;
      --muted: #7a7870;
      --link: #aaa69c;
      --link-hover: #e6e2d8;
      --shadow: 0 1px 3px rgba(0,0,0,0.15);
      --input-bg: #2a2926;
      --input-border: #4a4844;
      --label: #b0aca2;
    }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 5vw;
      min-height: 100vh;
    }
    .form-wrapper {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      padding: 3rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }
    h1 {
      font-size: 2rem;
      font-weight: 400;
      color: var(--heading);
      margin-bottom: 0.5rem;
      text-align: center;
      line-height: 1.3;
    }
    .tema-btn {
      background: none; border: 1px solid var(--border); padding: 0.3rem 0.9rem;
      font-size: 0.8rem; font-family: inherit; cursor: pointer; color: var(--muted);
      letter-spacing: 0.5px; transition: 0.2s; border-radius: 3px; margin-bottom: 1.5rem;
    }
    .tema-btn:hover { border-color: var(--heading); color: var(--heading); }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.9rem;
      color: var(--label);
      margin-bottom: 0.4rem;
      letter-spacing: 0.3px;
    }
    input, textarea {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--input-border);
      border-radius: 3px;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--muted);
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    .erro {
      color: #b33;
      font-size: 0.85rem;
      margin-top: 0.3rem;
      display: none;
    }
    .erro.visivel {
      display: block;
    }
    .btn-enviar {
      background: none;
      border: 1px solid var(--border);
      padding: 0.7rem 2rem;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      color: var(--link);
      transition: 0.2s;
      width: 100%;
    }
    .btn-enviar:hover {
      border-color: var(--link-hover);
      color: var(--link-hover);
    }
    .sucesso {
      text-align: center;
      color: var(--text);
      padding: 2rem 0;
      display: none;
    }
    footer { margin-top: 2.5rem; }
    a.back {
      display: inline-block;
      background: none;
      border: 1px solid var(--border);
      padding: 0.6rem 1.8rem;
      font-size: 0.95rem;
      font-family: inherit;
      text-decoration: none;
      color: var(--link);
      transition: 0.2s;
    }
    a.back:hover { border-color: var(--link-hover); color: var(--link-hover); }
    @media (max-width: 600px) {
      body { padding: 1.5rem 3vw; }
      .form-wrapper {
        padding: 2.2rem 1rem;
        border-radius: 0;
        border-left: none;
        border-right: none;
        box-shadow: none;
      }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <button id="temaToggle" class="tema-btn" aria-label="Alternar modo claro/escuro">modo escuro</button>
    <h1>contato</h1>
    <p style="text-align:center;color:#8c8c8c;margin-bottom:2.5rem;font-size:0.9rem;">Escreva sua mensagem</p>

    <form id="formContato" novalidate>
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
        <span class="erro" id="erroNome">Informe seu nome.</span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <span class="erro" id="erroEmail">Informe um email válido.</span>
      </div>

      <div class="form-group">
        <label for="assunto">Assunto</label>
        <input type="text" id="assunto" name="assunto" required>
        <span class="erro" id="erroAssunto">Informe o assunto.</span>
      </div>

      <div class="form-group">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" required></textarea>
        <span class="erro" id="erroMensagem">Escreva sua mensagem.</span>
      </div>

      <button type="submit" class="btn-enviar">enviar</button>
    </form>

    <div class="sucesso" id="msgSucesso">
      <p>Mensagem enviada com sucesso.</p>
    </div>
  </div>

  <footer>
    <a href="index.html" class="back">← voltar ao blog</a>
  </footer>

  <script>
    (function() {
      var b = document.body, t = document.getElementById('temaToggle'), d = localStorage.getItem('tema') === 'escuro';
      if (d) b.classList.add('dark');
      if (t) {
        t.textContent = d ? 'claro' : 'escuro';
        t.addEventListener('click', function() {
          b.classList.toggle('dark');
          var e = b.classList.contains('dark');
          localStorage.setItem('tema', e ? 'escuro' : 'claro');
          t.textContent = e ? 'modo claro' : 'modo escuro';
        });
      }
    })();

    function validarFormularioContato() {
      var valido = true;

      var nome = document.getElementById('nome').value.trim();
      if (!nome) {
        document.getElementById('erroNome').classList.add('visivel');
        valido = false;
      } else {
        document.getElementById('erroNome').classList.remove('visivel');
      }

      var email = document.getElementById('email').value.trim();
      var emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!email || !emailValido) {
        document.getElementById('erroEmail').classList.add('visivel');
        valido = false;
      } else {
        document.getElementById('erroEmail').classList.remove('visivel');
      }

      var assunto = document.getElementById('assunto').value.trim();
      if (!assunto) {
        document.getElementById('erroAssunto').classList.add('visivel');
        valido = false;
      } else {
        document.getElementById('erroAssunto').classList.remove('visivel');
      }

      var mensagem = document.getElementById('mensagem').value.trim();
      if (!mensagem) {
        document.getElementById('erroMensagem').classList.add('visivel');
        valido = false;
      } else {
        document.getElementById('erroMensagem').classList.remove('visivel');
      }

      return valido;
    }

    document.getElementById('formContato').addEventListener('submit', function(e) {
      e.preventDefault();

      if (!validarFormularioContato()) return;

      document.getElementById('formContato').style.display = 'none';
      document.getElementById('msgSucesso').style.display = 'block';
    });
  </script>
</body>
</html>
