<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} – fotografia bélica</title>
  <meta name="description" content="{{DESCRIPTION}}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:site_name" content="fotografia bélica">
  <meta property="article:published_time" content="{{DATE}}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://placehold.co/1200x630/1a1a1a/fafaf8?text=fotografia+b%C3%A9lica">

  <!-- Open Graph Image -->
  <meta property="og:image" content="https://placehold.co/1200x630/1a1a1a/fafaf8?text=fotografia+b%C3%A9lica">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{CANONICAL_URL}}">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafaf8;
      --text: #2c2c2c;
      --card-bg: #fff;
      --border: #eae6e0;
      --heading: #1a1a1a;
      --muted: #8c8c8c;
      --link: #555;
      --link-hover: #1a1a1a;
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
    }
    body.dark {
      --bg: #1c1c1a;
      --text: #d6d2ca;
      --card-bg: #262522;
      --border: #3a3935;
      --heading: #e6e2d8;
      --muted: #7a7870;
      --link: #aaa69c;
      --link-hover: #e6e2d8;
      --shadow: 0 1px 3px rgba(0,0,0,0.15);
    }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 5vw;
      min-height: 100vh;
    }

    .post-wrapper {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      padding: 3rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .tema-btn {
      background: none; border: 1px solid var(--border); padding: 0.3rem 0.9rem;
      font-size: 0.8rem; font-family: inherit; cursor: pointer; color: var(--muted);
      letter-spacing: 0.5px; transition: 0.2s; border-radius: 3px; margin-bottom: 1.5rem;
    }
    .tema-btn:hover { border-color: var(--heading); color: var(--heading); }

    h1 {
      font-size: 2rem;
      font-weight: 400;
      color: var(--heading);
      margin-bottom: 0.5rem;
      text-align: center;
      line-height: 1.3;
    }

    .date {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
      letter-spacing: 0.5px;
    }

    .content { font-size: 1.1rem; }
    .content p { margin-bottom: 1rem; }

    footer { margin-top: 2.5rem; }

    a.back {
      display: inline-block;
      background: none;
      border: 1px solid var(--border);
      padding: 0.6rem 1.8rem;
      font-size: 0.95rem;
      font-family: inherit;
      text-decoration: none;
      color: var(--link);
      transition: 0.2s;
    }
    a.back:hover { border-color: var(--link-hover); color: var(--link-hover); }

    @media (max-width: 600px) {
      body { padding: 1.5rem 3vw; }
      .post-wrapper {
        padding: 2.2rem 1rem;
        border-radius: 0;
        border-left: none;
        border-right: none;
        box-shadow: none;
      }
      h1 { font-size: 1.6rem; }
      .content { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="post-wrapper">
    <button id="temaToggle" class="tema-btn" aria-label="Alternar modo claro/escuro">modo escuro</button>
    <h1>{{TITLE}}</h1>
    <div class="date">{{DATE_FORMATTED}}</div>
    <div class="content">
      {{CONTENT_HTML}}
    </div>
  </div>
  <footer>
    <a href="../index.html" class="back">← voltar ao blog</a>
  </footer>

  <script>
    (function() {
      var b = document.body, t = document.getElementById('temaToggle'), d = localStorage.getItem('tema') === 'escuro';
      if (d) b.classList.add('dark');
      if (t) {
        t.textContent = d ? 'modo claro' : 'modo escuro';
        t.addEventListener('click', function() {
          b.classList.toggle('dark');
          var e = b.classList.contains('dark');
          localStorage.setItem('tema', e ? 'escuro' : 'claro');
          t.textContent = e ? 'modo claro' : 'modo escuro';
        });
      }
    })();
  </script>
</body>
</html>
